name: 'Check Logs'
description: 'Checks a GitHub workflow run (or the latest runs of the workflows in the WORKFLOWS variable) for failures and extracts the errors from its logs'
inputs:
  gh_token:
    description: 'GitHub token with actions:read on the repository (github.token is enough for the same repository)'
    required: true
  runId:
    description: 'ID of the workflow run to check (for example github.event.workflow_run.id). If empty, the latest runs of the workflows in the WORKFLOWS repository variable are checked'
    required: false
    default: ''
  workflows:
    description: 'JSON array of workflow names to check when runId is empty. Default is the WORKFLOWS repository variable'
    required: false
    default: ''
  maxErrors:
    description: 'Maximum number of error lines to include in the message'
    required: false
    default: '50'

outputs:
  allFoundErrors:
    description: 'All errors found in the logs of the workflow run (base64 encoded)'
    value: ${{ steps.check_logs.outputs.allFoundErrors }}
  workflowRunName:
    description: 'Name of the workflow run'
    value: ${{ steps.check_logs.outputs.workflowRunName }}
  workflowRunId:
    description: 'ID of the workflow run'
    value: ${{ steps.check_logs.outputs.workflowRunId }}
  workflowRunAttempts:
    description: 'Number of attempts of the workflow run'
    value: ${{ steps.check_logs.outputs.workflowRunAttempts }}
  workflowRunStartTime:
    description: 'Start time of the workflow run'
    value: ${{ steps.check_logs.outputs.workflowRunStartTime }}
  workflowRunOnBranch:
    description: 'Branch on which the workflow run was executed'
    value: ${{ steps.check_logs.outputs.workflowRunOnBranch }}
  workflowRunAtEvent:
    description: 'Event that triggered the workflow run'
    value: ${{ steps.check_logs.outputs.workflowRunAtEvent }}
  workflowRunConclusion:
    description: 'Conclusion of the workflow run'
    value: ${{ steps.check_logs.outputs.workflowRunConclusion }}
  workflowRunURL:
    description: 'URL of the workflow run'
    value: ${{ steps.check_logs.outputs.workflowRunURL }}
  workflowRunMessage:
    description: 'Message summarizing the workflow run and its errors (base64 encoded)'
    value: ${{ steps.check_logs.outputs.workflowRunMessage }}
  found:
    description: 'true if a run with a reportable conclusion (failure, cancelled, timed_out, ...) was found'
    value: ${{ steps.check_logs.outputs.found }}
runs:
  using: 'composite'
  steps:
    - name: 'Check Workflow Logs'
      id: check_logs
      shell: pwsh
      env:
        _ghToken: ${{ inputs.gh_token }}
        _runId: ${{ inputs.runId }}
        _workflows: ${{ inputs.workflows }}
        _maxErrors: ${{ inputs.maxErrors }}
      run: |
        try { & (Join-Path $env:GITHUB_ACTION_PATH 'CheckLogs.ps1') -GH_TOKEN $env:_ghToken -REPO $env:GITHUB_REPOSITORY -RunId $env:_runId -Workflows $env:_workflows -MaxErrors ([int]$env:_maxErrors) } catch { Write-Host "::Error::Unexpected error when running action ($($_.Exception.Message))"; exit 1 }
